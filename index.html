<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background:
        radial-gradient(
            circle at center,
            #250000 0%,
            #090909 70%,
            #000000 100%
        );

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    color: white;
}


/* =========================
   TITLE
========================= */

h1 {
    position: relative;

    margin:
        35px auto 20px;

    width: 95%;

    text-align: center;

    font-size:
        clamp(
            28px,
            5vw,
            60px
        );

    line-height: 1.1;

    font-weight: 900;

    color: white;

    text-shadow:
        0 0 10px #000,
        0 0 25px #ff0000,
        0 0 45px #ffd700;

    z-index: 10;
}


/* =========================
   FLAG
========================= */

.flag {
    position: relative;

    display: block;

    width:
        min(
            498px,
            75vw
        );

    height: auto;

    margin: 0 auto;

    z-index: 10;

    border-radius: 5px;

    box-shadow:
        0 0 25px
        rgba(255,255,255,.25),

        0 0 60px
        rgba(255,0,0,.25);
}


/* =========================
   SCUBA
========================= */

.scuba {
    position: fixed;

    width: 100px;

    height: auto;

    z-index: 30;

    pointer-events: none;

    user-select: none;
}


.scuba-1 {
    left: 4%;
    top: 12%;
    transform: rotate(-18deg);
}

.scuba-2 {
    right: 5%;
    top: 16%;
    transform: rotate(20deg);
}

.scuba-3 {
    left: 7%;
    bottom: 15%;
    transform: rotate(35deg);
}

.scuba-4 {
    right: 7%;
    bottom: 13%;
    transform: rotate(-30deg);
}

.scuba-5 {
    left: 18%;
    top: 38%;
    transform: rotate(12deg);
}

.scuba-6 {
    right: 18%;
    top: 42%;
    transform: rotate(-20deg);
}

.scuba-7 {
    left: 2%;
    top: 65%;
    transform: rotate(45deg);
}

.scuba-8 {
    right: 2%;
    top: 68%;
    transform: rotate(-45deg);
}


/* =========================
   FIREWORK CANVAS
========================= */

#fireworks {
    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    z-index: 20;

    cursor: crosshair;

    background: transparent;
}


/* =========================
   HINT
========================= */

.hint {
    position: relative;

    margin-top: 18px;

    text-align: center;

    font-size: 15px;

    opacity: .9;

    z-index: 10;
}


@media (max-width: 600px) {

    h1 {
        margin-top: 25px;
    }

    .flag {
        width: 82vw;
    }

    .scuba {
        width: 65px;
    }

}

</style>

<script>


/* =====================================================
   AUDIO ENGINE
===================================================== */

let audioContext = null;


/* Get audio context */

function getAudio() {

    if (!audioContext) {

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }

    if (
        audioContext.state ===
        "suspended"
    ) {

        audioContext.resume();

    }

    return audioContext;
}


/* =====================================================
   REALISTIC FIREWORK BOOM
===================================================== */

function explosionSound() {

    const audio =
        getAudio();

    const now =
        audio.currentTime;


    /* ---------------------------------
       LOW FREQUENCY BOOM
    --------------------------------- */

    const boom =
        audio.createOscillator();

    const boomGain =
        audio.createGain();


    boom.type =
        "sine";


    const pitch =
        45 +
        Math.random() * 25;


    boom.frequency.setValueAtTime(
        pitch,
        now
    );


    boom.frequency.exponentialRampToValueAtTime(
        22,
        now + 0.65
    );


    boomGain.gain.setValueAtTime(
        0.0001,
        now
    );


    boomGain.gain.exponentialRampToValueAtTime(
        0.7,
        now + 0.015
    );


    boomGain.gain.exponentialRampToValueAtTime(
        0.0001,
        now + 0.65
    );


    boom.connect(
        boomGain
    );

    boomGain.connect(
        audio.destination
    );


    boom.start(now);

    boom.stop(
        now + 0.7
    );


    /* ---------------------------------
       EXPLOSION IMPACT
    --------------------------------- */

    const impact =
        audio.createOscillator();

    const impactGain =
        audio.createGain();


    impact.type =
        "triangle";


    impact.frequency.setValueAtTime(
        110,
        now
    );


    impact.frequency.exponentialRampToValueAtTime(
        40,
        now + 0.25
    );


    impactGain.gain.setValueAtTime(
        0.0001,
        now
    );


    impactGain.gain.exponentialRampToValueAtTime(
        0.35,
        now + 0.01
    );


    impactGain.gain.exponentialRampToValueAtTime(
        0.0001,
        now + 0.3
    );


    impact.connect(
        impactGain
    );

    impactGain.connect(
        audio.destination
    );


    impact.start(now);

    impact.stop(
        now + 0.35
    );


    /* ---------------------------------
       CRACKLE NOISE
    --------------------------------- */

    const duration =
        0.8;


    const buffer =
        audio.createBuffer(
            1,
            audio.sampleRate * duration,
            audio.sampleRate
        );


    const data =
        buffer.getChannelData(0);


    /*
       Mostly silence with random
       short crackles.
    */

    for (
        let i = 0;

        i < data.length;

        i++
    ) {

        data[i] = 0;

    }


    const crackleCount =
        35 +
        Math.floor(
            Math.random() * 30
        );


    for (
        let i = 0;

        i < crackleCount;

        i++
    ) {

        const start =
            Math.floor(
                Math.random()
                *
                data.length
            );


        const length =
            Math.floor(
                audio.sampleRate
                *
                (
                    0.003 +
                    Math.random()
                    * 0.012
                )
            );


        const amplitude =
            0.25 +
            Math.random()
            * 0.65;


        for (
            let j = 0;

            j < length &&
            start + j <
            data.length;

            j++
        ) {

            /*
               Short noise burst
            */

            const fade =
                1 -
                j / length;


            data[start + j] =
                (
                    Math.random()
                    * 2 - 1
                )
                *
                amplitude
                *
                fade;

        }

    }


    const crackle =
        audio.createBufferSource();


    crackle.buffer =
        buffer;


    const crackleGain =
        audio.createGain();


    crackleGain.gain.value =
        0.35;


    crackle.connect(
        crackleGain
    );

    crackleGain.connect(
        audio.destination
    );


    crackle.start(
        now
    );

}


/* =====================================================
   ROCKET WHOOSH
===================================================== */

function launchSound() {

    const audio =
        getAudio();

    const now =
        audio.currentTime;


    /* ---------------------------------
       WHOOSH OSCILLATOR
    --------------------------------- */

    const oscillator =
        audio.createOscillator();

    const gain =
        audio.createGain();


    oscillator.type =
        "sawtooth";


    const startPitch =
        80 +
        Math.random() * 40;


    const endPitch =
        500 +
        Math.random() * 250;


    oscillator.frequency.setValueAtTime(
        startPitch,
        now
    );


    oscillator.frequency.exponentialRampToValueAtTime(
        endPitch,
        now + 0.45
    );


    gain.gain.setValueAtTime(
        0.0001,
        now
    );


    gain.gain.exponentialRampToValueAtTime(
        0.08,
        now + 0.08
    );


    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        now + 0.45
    );


    oscillator.connect(
        gain
    );

    gain.connect(
        audio.destination
    );


    oscillator.start(now);

    oscillator.stop(
        now + 0.45
    );


    /* ---------------------------------
       AIR NOISE
    --------------------------------- */

    const buffer =
        audio.createBuffer(
            1,
            audio.sampleRate * 0.45,
            audio.sampleRate
        );


    const data =
        buffer.getChannelData(0);


    for (
        let i = 0;

        i < data.length;

        i++
    ) {

        data[i] =
            (
                Math.random()
                * 2 - 1
            );

    }


    const noise =
        audio.createBufferSource();


    noise.buffer =
        buffer;


    const filter =
        audio.createBiquadFilter();


    filter.type =
        "lowpass";


    filter.frequency.setValueAtTime(
        500,
        now
    );


    filter.frequency.exponentialRampToValueAtTime(
        2500,
        now + 0.4
    );


    const noiseGain =
        audio.createGain();


    noiseGain.gain.setValueAtTime(
        0.0001,
        now
    );


    noiseGain.gain.exponentialRampToValueAtTime(
        0.05,
        now + 0.1
    );


    noiseGain.gain.exponentialRampToValueAtTime(
        0.0001,
        now + 0.45
    );


    noise
        .connect(filter)
        .connect(noiseGain)
        .connect(audio.destination);


    noise.start(now);

}


/* =====================================================
   CANVAS
===================================================== */

const canvas =
    document.getElementById(
        "fireworks"
    );


const ctx =
    canvas.getContext(
        "2d"
    );


let W =
    window.innerWidth;


let H =
    window.innerHeight;


function resize() {

    W =
        window.innerWidth;

    H =
        window.innerHeight;

    canvas.width =
        W;

    canvas.height =
        H;

}


resize();


window.addEventListener(
    "resize",
    resize
);


/* =====================================================
   FIREWORK DATA
===================================================== */

const rockets = [];

const particles = [];


const colors = [

    "#ff0000",
    "#ffffff",
    "#ffd700",
    "#0066ff",
    "#ff4d6d",
    "#66b7ff"

];


/* =====================================================
   ROCKET
===================================================== */

class Rocket {

    constructor(
        x,
        targetY
    ) {

        this.x =
            x;

        this.y =
            H + 20;

        this.targetY =
            targetY;

        this.speed =
            7 +
            Math.random() * 3;

        this.color =
            colors[
                Math.floor(
                    Math.random()
                    *
                    colors.length
                )
            ];

        this.trail = [];

    }


    update() {

        this.trail.push({

            x: this.x,

            y: this.y

        });


        if (
            this.trail.length > 12
        ) {

            this.trail.shift();

        }


        this.y -=
            this.speed;


        if (
            this.y <=
            this.targetY
        ) {

            this.explode();

            return true;

        }


        return false;

    }


    draw() {

        for (
            let i = 0;

            i < this.trail.length;

            i++
        ) {

            const point =
                this.trail[i];


            const alpha =
                i /
                this.trail.length;


            ctx.beginPath();


            ctx.arc(

                point.x,

                point.y,

                1.5,

                0,

                Math.PI * 2

            );


            ctx.fillStyle =
                `rgba(
                    255,
                    255,
                    255,
                    ${alpha}
                )`;


            ctx.fill();

        }


        ctx.beginPath();


        ctx.arc(

            this.x,

            this.y,

            3,

            0,

            Math.PI * 2

        );


        ctx.fillStyle =
            this.color;


        ctx.shadowBlur =
            20;


        ctx.shadowColor =
            this.color;


        ctx.fill();


        ctx.shadowBlur =
            0;

    }


    explode() {

        /*
           Play boom
        */

        explosionSound();


        /*
           Main explosion
        */

        for (
            let i = 0;

            i < 140;

            i++
        ) {

            const angle =
                Math.random()
                *
                Math.PI
                *
                2;


            const speed =
                2 +
                Math.random() * 7;


            particles.push(

                new Particle(

                    this.x,

                    this.y,

                    Math.cos(angle)
                    * speed,

                    Math.sin(angle)
                    * speed,

                    this.color

                )

            );

        }


        /*
           White sparkle ring
        */

        for (
            let i = 0;

            i < 45;

            i++
        ) {

            const angle =
                Math.PI
                *
                2
                *
                i
                /
                45;


            particles.push(

                new Particle(

                    this.x,

                    this.y,

                    Math.cos(angle)
                    * 5,

                    Math.sin(angle)
                    * 5,

                    "#ffffff"

                )

            );

        }

    }

}


/* =====================================================
   PARTICLE
===================================================== */

class Particle {

    constructor(
        x,
        y,
        vx,
        vy,
        color
    ) {

        this.x =
            x;

        this.y =
            y;

        this.vx =
            vx;

        this.vy =
            vy;

        this.color =
            color;

        this.life =
            1;

        this.size =
            1 +
            Math.random() * 2;

        this.gravity =
            0.065;

    }


    update() {

        this.x +=
            this.vx;


        this.y +=
            this.vy;


        this.vx *=
            0.985;


        this.vy *=
            0.985;


        this.vy +=
            this.gravity;


        this.life -=
            0.012;


        return (
            this.life <= 0
        );

    }


    draw() {

        ctx.beginPath();


        ctx.arc(

            this.x,

            this.y,

            this.size,

            0,

            Math.PI * 2

        );


        ctx.globalAlpha =
            this.life;


        ctx.fillStyle =
            this.color;


        ctx.shadowBlur =
            15;


        ctx.shadowColor =
            this.color;


        ctx.fill();


        ctx.globalAlpha =
            1;


        ctx.shadowBlur =
            0;

    }

}


/* =====================================================
   ANIMATION
===================================================== */

function animate() {

    /*
       Transparent canvas.
    */

    ctx.clearRect(

        0,

        0,

        W,

        H

    );


    /* Rockets */

    for (
        let i =
            rockets.length - 1;

        i >= 0;

        i--
    ) {

        const finished =
            rockets[i].update();


        rockets[i].draw();


        if (
            finished
        ) {

            rockets.splice(
                i,
                1
            );

        }

    }


    /* Particles */

    for (
        let i =
            particles.length - 1;

        i >= 0;

        i--
    ) {

        const dead =
            particles[i].update();


        particles[i].draw();


        if (
            dead
        ) {

            particles.splice(
                i,
                1
            );

        }

    }


    requestAnimationFrame(
        animate
    );

}


animate();


/* =====================================================
   CLICK
===================================================== */

canvas.addEventListener(

    "click",

    function(event) {

        /*
           Start browser audio.
        */

        getAudio();


        /*
           Rocket whoosh.
        */

        launchSound();


        /*
           Firework target.
        */

        let targetY =
            event.clientY;


        if (
            targetY >
            H - 100
        ) {

            targetY =
                H - 100;

        }


        /*
           Create rocket.
        */

        rockets.push(

            new Rocket(

                event.clientX,

                targetY

            )

        );

    }

);

</script>
