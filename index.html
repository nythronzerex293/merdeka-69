/* ==========================================

========================================== */

.scuba {

    width: 100px;

<!-- ==========================================
     FIREWORK CANVAS
========================================== -->

<canvas id="fireworks"></canvas>


<script>


/* ==========================================
   CANVAS SETUP
========================================== */

const canvas =
    document.getElementById(
        "fireworks"
    );


const ctx =
    canvas.getContext("2d");


let W =
    window.innerWidth;


let H =
    window.innerHeight;


function resize() {

    W =
        window.innerWidth;

    H =
        window.innerHeight;

    canvas.width =
        W;

    canvas.height =
        H;
}


resize();


window.addEventListener(
    "resize",
    resize
);


/* ==========================================
   FIREWORK STORAGE
========================================== */

const rockets = [];

const particles = [];


const colors = [

    "#ff0000",

    "#ffffff",

    "#ffd700",

    "#0066ff",

    "#ff4d6d",

    "#66b7ff"

];


/* ==========================================
   ROCKET
========================================== */

class Rocket {

    constructor(
        x,
        targetY
    ) {

        this.x =
            x;

        this.y =
            H + 20;

        this.targetY =
            targetY;

        this.speed =
            7 +
            Math.random() * 3;

        this.color =
            colors[
                Math.floor(
                    Math.random()
                    * colors.length
                )
            ];

        this.trail = [];

    }


    update() {

        this.trail.push({

            x:
                this.x,

            y:
                this.y

        });


        if (
            this.trail.length > 12
        ) {

            this.trail.shift();

        }


        this.y -=
            this.speed;


        if (
            this.y <=
            this.targetY
        ) {

            this.explode();

            return true;

        }


        return false;

    }


    draw() {

        /*
           Draw rocket trail
        */

        for (
            let i = 0;

            i < this.trail.length;

            i++
        ) {

            const point =
                this.trail[i];


            const alpha =
                i /
                this.trail.length;


            ctx.beginPath();


            ctx.arc(

                point.x,

                point.y,

                1.5,

                0,

                Math.PI * 2

            );


            ctx.fillStyle =
                `rgba(
                    255,
                    255,
                    255,
                    ${alpha}
                )`;


            ctx.fill();

        }


        /*
           Rocket
        */

        ctx.beginPath();


        ctx.arc(

            this.x,

            this.y,

            3,

            0,

            Math.PI * 2

        );


        ctx.fillStyle =
            this.color;


        ctx.shadowBlur =
            20;


        ctx.shadowColor =
            this.color;


        ctx.fill();


        ctx.shadowBlur =
            0;

    }


    explode() {

        /*
           Main explosion
        */

        for (
            let i = 0;

            i < 140;

            i++
        ) {

            const angle =
                Math.random()
                *
                Math.PI
                *
                2;


            const speed =
                2 +
                Math.random()
                * 7;


            particles.push(

                new Particle(

                    this.x,

                    this.y,

                    Math.cos(angle)
                    * speed,

                    Math.sin(angle)
                    * speed,

                    this.color

                )

            );

        }


        /*
           White sparkle ring
        */

        for (
            let i = 0;

            i < 45;

            i++
        ) {

            const angle =
                Math.PI
                *
                2
                *
                i
                /
                45;


            particles.push(

                new Particle(

                    this.x,

                    this.y,

                    Math.cos(angle)
                    * 5,

                    Math.sin(angle)
                    * 5,

                    "#ffffff"

                )

            );

        }

    }

}


/* ==========================================
   PARTICLE
========================================== */

class Particle {

    constructor(
        x,
        y,
        vx,
        vy,
        color
    ) {

        this.x =
            x;

        this.y =
            y;

        this.vx =
            vx;

        this.vy =
            vy;

        this.color =
            color;

        this.life =
            1;

        this.size =
            1 +
            Math.random()
            * 2;

        this.gravity =
            0.065;

    }


    update() {

        this.x +=
            this.vx;


        this.y +=
            this.vy;


        this.vx *=
            0.985;


        this.vy *=
            0.985;


        this.vy +=
            this.gravity;


        this.life -=
            0.012;


        return (
            this.life <= 0
        );

    }


    draw() {

        ctx.beginPath();


        ctx.arc(

            this.x,

            this.y,

            this.size,

            0,

            Math.PI * 2

        );


        /*
           Fade particle naturally
        */

        ctx.globalAlpha =
            this.life;


        ctx.fillStyle =
            this.color;


        ctx.shadowBlur =
            15;


        ctx.shadowColor =
            this.color;


        ctx.fill();


        ctx.globalAlpha =
            1;


        ctx.shadowBlur =
            0;

    }

}


/* ==========================================
   ANIMATION LOOP
========================================== */

function animate() {

    /*
       IMPORTANT:
       Clear canvas instead of painting
       black over the GIFs.
    */

    ctx.clearRect(

        0,

        0,

        W,

        H

    );


    /* ======================
       ROCKETS
    ====================== */

    for (
        let i =
            rockets.length - 1;

        i >= 0;

        i--
    ) {

        const finished =
            rockets[i].update();


        rockets[i].draw();


        if (
            finished
        ) {

            rockets.splice(

                i,

                1

            );

        }

    }


    /* ======================
       PARTICLES
    ====================== */

    for (
        let i =
            particles.length - 1;

        i >= 0;

        i--
    ) {

        const dead =
            particles[i].update();


        particles[i].draw();


        if (
            dead
        ) {

            particles.splice(

                i,

                1

            );

        }

    }


    requestAnimationFrame(
        animate
    );

}


animate();


/* ==========================================
   CLICK → FIREWORK
========================================== */

canvas.addEventListener(

    "click",

    function(event) {


        let targetY =
            event.clientY;


        /*
           Don't explode too close
           to the bottom.
        */

        if (
            targetY >
            H - 100
        ) {

            targetY =
                H - 100;

        }


        rockets.push(

            new Rocket(

                event.clientX,

                targetY

            )

        );

    }

);

</script>
