<!DOCTYPE html>
<html lang="ms">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hari Kebangsaan 69</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background:
        radial-gradient(
            circle at center,
            #250000 0%,
            #090909 70%,
            #000000 100%
        );

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    color: white;
}


/* =========================
   TITLE
========================= */

h1 {
    position: relative;

    margin:
        35px auto 20px;

    width: 95%;

    text-align: center;

    font-size:
        clamp(
            28px,
            5vw,
            60px
        );

    line-height: 1.1;

    font-weight: 900;

    color: white;

    text-shadow:
        0 0 10px #000,
        0 0 25px #ff0000,
        0 0 45px #ffd700;

    z-index: 10;
}


/* =========================
   FLAG
========================= */

.flag {
    position: relative;

    display: block;

    width:
        min(
            498px,
            75vw
        );

    height: auto;

    margin: 0 auto;

    z-index: 10;

    border-radius: 5px;

    box-shadow:
        0 0 25px
        rgba(255,255,255,.25),

        0 0 60px
        rgba(255,0,0,.25);
}


/* =========================
   SCUBA
========================= */

.scuba {
    position: fixed;

    width: 100px;

    height: auto;

    z-index: 30;

    pointer-events: none;

    user-select: none;
}


.scuba-1 {
    left: 4%;
    top: 12%;
    transform: rotate(-18deg);
}

.scuba-2 {
    right: 5%;
    top: 16%;
    transform: rotate(20deg);
}

.scuba-3 {
    left: 7%;
    bottom: 15%;
    transform: rotate(35deg);
}

.scuba-4 {
    right: 7%;
    bottom: 13%;
    transform: rotate(-30deg);
}

.scuba-5 {
    left: 18%;
    top: 38%;
    transform: rotate(12deg);
}

.scuba-6 {
    right: 18%;
    top: 42%;
    transform: rotate(-20deg);
}

.scuba-7 {
    left: 2%;
    top: 65%;
    transform: rotate(45deg);
}

.scuba-8 {
    right: 2%;
    top: 68%;
    transform: rotate(-45deg);
}


/* =========================
   FIREWORK CANVAS
========================= */

#fireworks {
    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    z-index: 20;

    cursor: crosshair;

    background: transparent;
}


/* =========================
   HINT
========================= */

.hint {
    position: relative;

    margin-top: 18px;

    text-align: center;

    font-size: 15px;

    opacity: .9;

    z-index: 10;
}


@media (max-width: 600px) {

    h1 {
        margin-top: 25px;
    }

    .flag {
        width: 82vw;
    }

    .scuba {
        width: 65px;
    }

}

</style>

</head>


<body>


<h1>
    SELAMAT MENYAMBUT<br>
    HARI KEBANGSAAN KE-69
</h1>


<img
    class="flag"
    src="./malaysia-flag.gif"
    alt="Jalur Gemilang"
>


<img class="scuba scuba-1" src="./scuba.gif" alt="">
<img class="scuba scuba-2" src="./scuba.gif" alt="">
<img class="scuba scuba-3" src="./scuba.gif" alt="">
<img class="scuba scuba-4" src="./scuba.gif" alt="">
<img class="scuba scuba-5" src="./scuba.gif" alt="">
<img class="scuba scuba-6" src="./scuba.gif" alt="">
<img class="scuba scuba-7" src="./scuba.gif" alt="">
<img class="scuba scuba-8" src="./scuba.gif" alt="">


<div class="hint">
    🎆 Klik mana-mana untuk bunga api 🎆
</div>


<canvas id="fireworks"></canvas>


<script>


/* =====================================================
   AUDIO ENGINE
===================================================== */

let audioContext = null;

function getAudio() {
    if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioContext.state === "suspended") {
        audioContext.resume();
    }
    return audioContext;
}


/* =====================================================
   REALISTIC FIREWORK BOOM & CRACKLE (IMPROVED)
===================================================== */

function explosionSound() {
    const audio = getAudio();
    const now = audio.currentTime;

    /* ---------------------------------
       1. DEEP SUB-BASS BOOM (Dentuman Dalam)
    --------------------------------- */
    const subOsc = audio.createOscillator();
    const subGain = audio.createGain();

    subOsc.type = "sine";
    const baseFreq = 60 + Math.random() * 20;
    subOsc.frequency.setValueAtTime(baseFreq, now);
    subOsc.frequency.exponentialRampToValueAtTime(20, now + 0.8);

    subGain.gain.setValueAtTime(0.001, now);
    subGain.gain.exponentialRampToValueAtTime(0.8, now + 0.02);
    subGain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);

    subOsc.connect(subGain);
    subGain.connect(audio.destination);

    subOsc.start(now);
    subOsc.stop(now + 0.85);

    /* ---------------------------------
       2. MID IMPACT NOISE (Kesan Impak Udara)
    --------------------------------- */
    const noiseBuffer = audio.createBuffer(1, audio.sampleRate * 0.5, audio.sampleRate);
    const output = noiseBuffer.getChannelData(0);
    for (let i = 0; i < noiseBuffer.length; i++) {
        output[i] = Math.random() * 2 - 1;
    }

    const whiteNoise = audio.createBufferSource();
    whiteNoise.buffer = noiseBuffer;

    const filter = audio.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.setValueAtTime(800, now);
    filter.frequency.exponentialRampToValueAtTime(80, now + 0.4);

    const noiseGain = audio.createGain();
    noiseGain.gain.setValueAtTime(0.001, now);
    noiseGain.gain.exponentialRampToValueAtTime(0.6, now + 0.015);
    noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);

    whiteNoise.connect(filter);
    filter.connect(noiseGain);
    noiseGain.connect(audio.destination);

    whiteNoise.start(now);
    whiteNoise.stop(now + 0.55);

    /* ---------------------------------
       3. REALISTIC CRACKLE POPPING (Desiran Bunga Api)
    --------------------------------- */
    setTimeout(() => {
        const crackleDuration = 0.6;
        const crackleBuffer = audio.createBuffer(1, audio.sampleRate * crackleDuration, audio.sampleRate);
        const crackleData = crackleBuffer.getChannelData(0);

        const popCount = 20 + Math.floor(Math.random() * 25);
        for (let i = 0; i < popCount; i++) {
            const start = Math.floor(Math.random() * (crackleData.length - 200));
            const popLen = Math.floor(audio.sampleRate * 0.003);
            const amp = 0.15 + Math.random() * 0.45;
            for (let j = 0; j < popLen; j++) {
                crackleData[start + j] = (Math.random() * 2 - 1) * amp * (1 - j / popLen);
            }
        }

        const crackleSource = audio.createBufferSource();
        crackleSource.buffer = crackleBuffer;

        const crackleFilter = audio.createBiquadFilter();
        crackleFilter.type = "bandpass";
        crackleFilter.frequency.value = 2500;
        crackleFilter.Q.value = 1.2;

        const crackleGain = audio.createGain();
        crackleGain.gain.setValueAtTime(0.3, audio.currentTime);
        crackleGain.gain.exponentialRampToValueAtTime(0.01, audio.currentTime + crackleDuration);

        crackleSource.connect(crackleFilter);
        crackleFilter.connect(crackleGain);
        crackleGain.connect(audio.destination);

        crackleSource.start();
    }, 120);
}


/* =====================================================
   SMOOTH ROCKET WHOOSH (IMPROVED)
===================================================== */

function launchSound() {
    const audio = getAudio();
    const now = audio.currentTime;

    const duration = 0.45;
    const buffer = audio.createBuffer(1, audio.sampleRate * duration, audio.sampleRate);
    const data = buffer.getChannelData(0);

    for (let i = 0; i < data.length; i++) {
        data[i] = Math.random() * 2 - 1;
    }

    const noise = audio.createBufferSource();
    noise.buffer = buffer;

    const filter = audio.createBiquadFilter();
    filter.type = "bandpass";
    filter.frequency.setValueAtTime(250, now);
    filter.frequency.exponentialRampToValueAtTime(1200, now + duration);
    filter.Q.value = 2.0;

    const gain = audio.createGain();
    gain.gain.setValueAtTime(0.001, now);
    gain.gain.exponentialRampToValueAtTime(0.25, now + 0.15);
    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

    noise.connect(filter);
    filter.connect(gain);
    gain.connect(audio.destination);

    noise.start(now);
}


/* =====================================================
   CANVAS & ANIMATION ENGINE
===================================================== */

const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");

let W = window.innerWidth;
let H = window.innerHeight;

function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
}

resize();
window.addEventListener("resize", resize);

const rockets = [];
const particles = [];
const colors = ["#ff0000", "#ffffff", "#ffd700", "#0066ff", "#ff4d6d", "#66b7ff"];

class Rocket {
    constructor(x, targetY) {
        this.x = x;
        this.y = H + 20;
        this.targetY = targetY;
        this.speed = 7 + Math.random() * 3;
        this.color = colors[Math.floor(Math.random() * colors.length)];
        this.trail = [];
    }

    update() {
        this.trail.push({ x: this.x, y: this.y });
        if (this.trail.length > 12) {
            this.trail.shift();
        }

        this.y -= this.speed;

        if (this.y <= this.targetY) {
            this.explode();
            return true;
        }
        return false;
    }

    draw() {
        for (let i = 0; i < this.trail.length; i++) {
            const point = this.trail[i];
            const alpha = i / this.trail.length;

            ctx.beginPath();
            ctx.arc(point.x, point.y, 1.5, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
            ctx.fill();
        }

        ctx.beginPath();
        ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 20;
        ctx.shadowColor = this.color;
        ctx.fill();
        ctx.shadowBlur = 0;
    }

    explode() {
        explosionSound();

        for (let i = 0; i < 140; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = 2 + Math.random() * 7;
            particles.push(new Particle(this.x, this.y, Math.cos(angle) * speed, Math.sin(angle) * speed, this.color));
        }

        for (let i = 0; i < 45; i++) {
            const angle = (Math.PI * 2 * i) / 45;
            particles.push(new Particle(this.x, this.y, Math.cos(angle) * 5, Math.sin(angle) * 5, "#ffffff"));
        }
    }
}

class Particle {
    constructor(x, y, vx, vy, color) {
        this.x = x;
        this.y = y;
        this.vx = vx;
        this.vy = vy;
        this.color = color;
        this.life = 1;
        this.size = 1 + Math.random() * 2;
        this.gravity = 0.065;
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vx *= 0.985;
        this.vy *= 0.985;
        this.vy += this.gravity;
        this.life -= 0.012;

        return this.life <= 0;
    }

    draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.globalAlpha = this.life;
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 15;
        ctx.shadowColor = this.color;
        ctx.fill();
        ctx.globalAlpha = 1;
        ctx.shadowBlur = 0;
    }
}

function animate() {
    ctx.clearRect(0, 0, W, H);

    for (let i = rockets.length - 1; i >= 0; i--) {
        const finished = rockets[i].update();
        rockets[i].draw();
        if (finished) {
            rockets.splice(i, 1);
        }
    }

    for (let i = particles.length - 1; i >= 0; i--) {
        const dead = particles[i].update();
        particles[i].draw();
        if (dead) {
            particles.splice(i, 1);
        }
    }

    requestAnimationFrame(animate);
}

animate();

canvas.addEventListener("click", function(event) {
    getAudio();
    launchSound();

    let targetY = event.clientY;
    if (targetY > H - 100) {
        targetY = H - 100;
    }

    rockets.push(new Rocket(event.clientX, targetY));
});

</script>

</body>

</html>
